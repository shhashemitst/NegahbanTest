<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نگهبانار – پنل مدیریت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef2f8;--surface:#fff;--ink:#0f1b33;--mute:#64718a;--line:#e1e7f1;--side:#0c1a33;--side2:#16294d;--side-ink:#c9d5ec;--blue:#2f6df6;--green:#17a673;--orange:#f59a1b;--red:#e5484d;--purple:#7c5cd6;--chip:#f3f6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08101f;--surface:#101d36;--ink:#eaf0fb;--mute:#8fa0c0;--line:#1f2f52;--side:#060d1a;--side2:#13264a;--chip:#16264a}}
:root[data-theme="dark"]{--bg:#08101f;--surface:#101d36;--ink:#eaf0fb;--mute:#8fa0c0;--line:#1f2f52;--side:#060d1a;--side2:#13264a;--chip:#16264a}
*,*::before,*::after{box-sizing:border-box}
.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.switch{position:sticky;top:0;z-index:30;background:var(--side);padding:10px 14px;display:flex;gap:8px;align-items:center;overflow-x:auto;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.switch b{color:#fff;font-weight:800;white-space:nowrap;margin-inline-end:6px}
.switch button{white-space:nowrap;padding:7px 14px;border-radius:999px;color:var(--side-ink);background:var(--side2);font-weight:500;transition:.2s}
.switch button[aria-selected=true]{background:var(--blue);color:#fff}
.theme{margin-inline-start:auto}
.app{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 56px)}
aside{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff;font-weight:800;font-size:16px}
.brand i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2f6df6,#7c5cd6);display:grid;place-items:center;font-style:normal}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;margin-bottom:2px;transition:.15s}
.nav a:hover{background:var(--side2)}
.nav a.on{background:var(--blue);color:#fff;font-weight:700}
main{padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:#fff;font-weight:800}
.who h1{margin:0;font-size:17px}.who small{color:var(--mute)}
.stat{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #17a67330}
.burger{display:none;background:var(--chip);border-radius:10px;width:40px;height:40px}
.search{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:18px}
.search input{flex:1;border:0;background:none;font:inherit;color:inherit;outline:0;min-width:0}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.2fr 1fr}
.tile{border-radius:18px;padding:22px 16px;color:#fff;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;min-height:130px;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile.lg{min-height:170px}.tile b{font-size:17px}.tile small{opacity:.85}.tile .ic{font-size:34px}
.c-blue{background:linear-gradient(135deg,#2f6df6,#1d4fd0)}.c-green{background:linear-gradient(135deg,#1fb985,#0f8a5f)}.c-orange{background:linear-gradient(135deg,#ffae2f,#ef8a00)}.c-red{background:linear-gradient(135deg,#f0595e,#c93338)}.c-purple{background:linear-gradient(135deg,#8c6cea,#6540c4)}.c-navy{background:linear-gradient(135deg,#1a3a73,#102650)}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.num{font-size:30px;font-weight:800;line-height:1.2}
.kpi{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;padding:16px;color:#fff}
.kpi span{font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th{color:var(--mute);font-weight:500;text-align:start;padding:8px;font-size:12.5px}
td{padding:10px 8px;border-top:1px solid var(--line)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--chip);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-g{color:var(--green)}.p-o{color:var(--orange)}.p-r{color:var(--red)}.p-b{color:var(--blue)}
.pill{color:inherit}.pill.p-g::before{background:var(--green)}.pill.p-o::before{background:var(--orange)}.pill.p-r::before{background:var(--red)}
.bar{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;margin:10px 0}
.bar div{height:12px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6df6,#5aa0ff);border-radius:9px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);flex:none}
.row span{margin-inline-start:auto;color:var(--mute);font-size:12px}
.btn{background:var(--blue);color:#fff;padding:8px 16px;border-radius:10px;font-weight:700;margin-top:12px}
.map{width:100%;height:200px}
.bottom{display:none}
.scrim{display:none}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset:0 0 0 auto;width:270px;max-width:82vw;z-index:50;height:100%;transform:translateX(100%);transition:.25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
 aside.open{transform:none}
 .scrim.show{display:block;position:fixed;inset:0;background:#0008;z-index:40}
 .burger{display:block}
 main{padding:14px 14px 90px}
 .g3{grid-template-columns:repeat(2,1fr)}
 .span3{grid-column:1/-1}
 .bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--side);z-index:35;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
 .bottom button{color:var(--side-ink);display:flex;flex-direction:column;align-items:center;font-size:11px;position:relative;gap:2px}
 .bottom button em{position:absolute;top:-4px;inset-inline-end:2px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-style:normal}
}
@media (max-width:480px){.g3,.g4{grid-template-columns:1fr 1fr}.tile.lg{min-height:140px}.span2{grid-column:1/-1}.bar{grid-template-columns:58px 1fr 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="switch" role="tablist" id="tabs"><b>🛡 نگهبانار</b></div>
<div class="app">
<aside id="side"><div class="brand"><i>🛡</i><span>سامانه نگهبانی و حراست</span></div><nav class="nav" id="nav"></nav></aside>

  <div class="stat"><span class="dot"></span>آنلاین · ۱۴۰۴/۰۶/۱۸ · ۰۵:۴۵</div>
 </div>

</main>
</div>
<div class="scrim" id="scrim"></div>

};
let cur='guard';
function render(){
 const p=P[cur];
 $('#name').textContent=p.name;$('#role').textContent=p.role;$('#av').textContent=p.av;
 $('#nav').innerHTML=ic(p.nav.map((n,i)=>`<a href="#" class="${i?'':'on'}"><span>${n.split(' ')[0]}</span>${n.split(' ').slice(1).join(' ')}</a>`).join(''));
 $('#view').innerHTML=ic(p.html());
 $('#bottom').innerHTML=ic(p.bottom.map(b=>{const[t,n]=b.split('|'),[i,...l]=t.split(' ');return `<button><span style="font-size:20px">${i}</span>${l.join(' ')}${n?`<em>${n}</em>`:''}</button>`}).join(''));
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur));
 close();window.scrollTo(0,0);
}
const tabs=$('#tabs');
Object.entries(P).forEach(([k,p])=>{const b=document.createElement('button');b.textContent=p.label;b.dataset.k=k;b.setAttribute('role','tab');b.onclick=()=>{cur=k;render()};tabs.appendChild(b)});
const th=document.createElement('button');th.className='theme';th.innerHTML=ic('🌓');th.setAttribute('aria-label','تغییر تم');th.onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#08101f';r.dataset.theme=d?'light':'dark'};tabs.appendChild(th);
function close(){$('#side').classList.remove('open');$('#scrim').classList.remove('show')}
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('show')};
$('#scrim').onclick=close;
$('#nav').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');close()});
document.querySelectorAll('.brand i,#burger,#tabs b').forEach(e=>e.innerHTML=ic(e.innerHTML));
render();
</script>
</body>
